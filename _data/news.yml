- date: { en: "Jul 2024", zh: "2024年7月" }
  en: "🏆 Traveled to Recife, Brazil for AIED 2024, where <a href=\"https://doi.org/10.1007/978-3-031-64302-6_19\">HypoCompass</a> won the <b>Best Paper</b> and <b>Best Interactive Event</b> awards!"
  zh: "🏆 前往巴西累西腓参加 AIED 2024，<a href=\"https://doi.org/10.1007/978-3-031-64302-6_19\">HypoCompass</a> 荣获<b>最佳论文奖</b>与<b>最佳互动展示奖</b>！"
