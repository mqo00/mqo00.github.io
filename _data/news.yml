# News items for the About page, newest first (upcoming items on top), written in
# first person. Dates are month + year; conference items use the conference month.
# `upcoming: true` adds an "Upcoming" tag. The first `show` items (set where
# _includes/news.html is included) are always visible; the rest fold away.

- date: { en: "Jun 2027", zh: "2027年6月" }
  upcoming: true
  en: "I will serve as Publicity Chair for the <a href=\"https://haic.cc/#/home\">Human–AI Interaction Conference</a> (Washington, DC)."
  zh: "我将担任在华盛顿特区举办的<a href=\"https://haic.cc/#/home\">人机交互会议（HAIC）2027</a>宣传主席。"

- date: { en: "Dec 2026", zh: "2026年12月" }
  upcoming: true
  en: "Our paper <a href=\"https://arxiv.org/abs/2606.14199\">OdysSim</a> will appear at NeurIPS 2026 in Sydney."
  zh: "我们的论文 <a href=\"https://arxiv.org/abs/2606.14199\">OdysSim</a> 将在悉尼 NeurIPS 2026 上发表。"

- date: { en: "Oct 2026", zh: "2026年10月" }
  upcoming: true
  en: "Our paper <a href=\"https://arxiv.org/abs/2603.11245\">Mind the Sim2Real Gap</a> will appear at COLM 2026 in San Francisco."
  zh: "我们的论文 <a href=\"https://arxiv.org/abs/2603.11245\">Mind the Sim2Real Gap</a> 将在旧金山 COLM 2026 上发表。"

- date: { en: "Sep 2026", zh: "2026年9月" }
  en: "I was named a 2026 Fellow on AI &amp; Society by CMU’s Block Center for Technology and Society."
  zh: "我入选CMU Block技术与社会中心 2026 年“AI与社会”研究员。"

- date: { en: "Aug 2026", zh: "2026年8月" }
  en: "Finished my Applied Science internship at <b>Microsoft</b> in Redmond, working with Shamsi Iqbal, Siddarth Suri, and Pranav Khape on how expertise and trust shape AI-assisted work."
  zh: "在雷德蒙德的<b>微软</b>完成了暑期应用科学实习生的工作，与 Shamsi Iqbal、Siddarth Suri 和 Pranav Khape 合作，研究专业水平与信任如何影响AI辅助工作。"

- date: { en: "Jul 2026", zh: "2026年7月" }
  en: "Presented my work <a href=\"https://doi.org/10.1007/978-3-032-29763-1_7\">“GenAI Defaults to Bias!”</a> and my doctoral consortium project on <a href=\"https://doi.org/10.1007/978-3-032-29794-5_44\">what calculus we should teach in the age of AI</a> at the Festival of Learning (AIED 2026) in Seoul. I also co-organized the <a href=\"https://sites.google.com/view/ai-literacy-for-all-2026/home\">Workshop on AI Literacy Education for All</a>."
  zh: "在首尔的学习节（AIED 2026）上发表了我的论文 <a href=\"https://doi.org/10.1007/978-3-032-29763-1_7\">“GenAI Defaults to Bias!”</a>，并在博士生论坛分享了<a href=\"https://doi.org/10.1007/978-3-032-29794-5_44\">AI时代应该教什么微积分</a>的研究；我还联合组织了<a href=\"https://sites.google.com/view/ai-literacy-for-all-2026/home\">“全民AI素养教育”研讨会</a>。"

- date: { en: "Jul 2026", zh: "2026年7月" }
  en: "Two papers accepted to ACL 2026: <a href=\"https://aclanthology.org/2026.acl-demo.68/\">RECAP</a> (Demos) and <a href=\"https://aclanthology.org/2026.findings-acl.441/\">What Prompts Don’t Say</a> (Findings)."
  zh: "两篇论文被 ACL 2026 接收：<a href=\"https://aclanthology.org/2026.acl-demo.68/\">RECAP</a>（系统演示）与 <a href=\"https://aclanthology.org/2026.findings-acl.441/\">What Prompts Don’t Say</a>（Findings）。"

