- date: { en: "Nov 2024", zh: "2024年11月" }
  en: "My advisors received a <a href=\"https://hcii.cmu.edu/news/scs-faculty-receive-google-academic-research-awards\">Google Academic Research Award</a> ($100K) for explicitly training humans toward human–AI collaboration. I helped write the proposal and am the lead PhD researcher on the project."
  zh: "我的导师获得<a href=\"https://hcii.cmu.edu/news/scs-faculty-receive-google-academic-research-awards\">谷歌学术研究奖</a>（10万美元），支持“显式训练人类进行人机协作”的研究；我参与了申请书撰写，并担任该项目的主导博士研究员。"

