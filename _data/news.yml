  zh: "作为受邀专家参加了在波士顿举办的 MIT 媒体实验室<a href=\"https://www.media.mit.edu/projects/report-benchmarks-for-human-flourishing-with-ai/overview/\">“AI与人类福祉评测基准”</a>研讨会。"

