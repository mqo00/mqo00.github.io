- date: { en: "Apr 2026", zh: "2026年4月" }
  en: "Presented my work <a href=\"https://dl.acm.org/doi/10.1145/3772318.3791283\">Not Everyone Wins with LLMs</a>, <a href=\"https://dl.acm.org/doi/10.1145/3731756\">ROPE</a> (TOCHI), and my doctoral consortium project <a href=\"https://doi.org/10.1145/3772363.3799213\">Training for the Future</a> at CHI 2026 in Barcelona! I also spoke on a panel at the Human-Agent Collaboration workshop and served as a student volunteer."
  zh: "在巴塞罗那 CHI 2026 上发表了我的论文 <a href=\"https://dl.acm.org/doi/10.1145/3772318.3791283\">Not Everyone Wins with LLMs</a>、<a href=\"https://dl.acm.org/doi/10.1145/3731756\">ROPE</a>（TOCHI），以及博士生论坛项目 <a href=\"https://doi.org/10.1145/3772363.3799213\">Training for the Future</a>！我还在人-智能体协作研讨会上担任嘉宾，并做了学生志愿者。"

